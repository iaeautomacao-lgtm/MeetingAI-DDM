<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Brand Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg-1); display: flex; align-items: center; gap: 40px; min-height: 220px; }
  .logo-block { display: flex; align-items: center; }
  .logo-block img { height: 64px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .lock { font-family: var(--font-display); font-size: 13px; color: var(--fg-3); letter-spacing: 0.06em; text-transform: uppercase; }
  .name { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--fg-1); letter-spacing: -0.01em; }
  .tag { font-family: var(--font-body); font-size: 14px; color: var(--fg-2); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--ddm-orange); display: inline-block; vertical-align: middle; margin-right: 8px; }
  .alt { display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; background: var(--ddm-orange); border-radius: 24px; }
  .alt span { font-family: var(--font-display); font-weight: 800; font-size: 38px; color: white; letter-spacing: -0.04em; line-height: 1; }
</style>
</head>
<body>
  <img src="../assets/logo.png" alt="Grupo DDM" style="height: 72px;">
  <div class="alt"><span>DDM</span></div>
  <div class="stack">
    <div class="lock">Master mark</div>
    <div class="name">Grupo DDM</div>
    <div class="tag"><span class="swatch"></span>#FF5706 · orange-on-white preferred</div>
  </div>
</body>
</html>
