<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Primary Color</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 280px 1fr 1fr 1fr 1fr; gap: 16px; align-items: stretch; height: 220px; }
  .hero { background: var(--ddm-orange); border-radius: 24px; color: white; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-orange); }
  .hero .label { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.9; }
  .hero .name { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .hero .hex { font-family: var(--font-mono); font-size: 18px; opacity: 0.9; }
  .tone { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; color: white; font-family: var(--font-display); font-size: 13px; font-weight: 600; }
  .tone .h { font-family: var(--font-mono); font-weight: 400; opacity: 0.85; font-size: 12px; margin-top: 4px; }
  .t-700 { background: var(--ddm-orange-700); }
  .t-600 { background: var(--ddm-orange-600); }
  .t-300 { background: var(--ddm-orange-300); color: #4a1a00; }
  .t-100 { background: var(--ddm-orange-100); color: var(--ddm-orange-700); }
</style>
</head>
<body>
  <div class="row">
    <div class="hero">
      <div class="label">Brand · Primary</div>
      <div>
        <div class="name">DDM Orange</div>
        <div class="hex">#FF5706</div>
      </div>
    </div>
    <div class="tone t-700"><div>700</div><div class="h">#C23E00</div></div>
    <div class="tone t-600"><div>600 · Hover</div><div class="h">#E84B00</div></div>
    <div class="tone t-300"><div>300</div><div class="h">#FF8754</div></div>
    <div class="tone t-100"><div>100 · Tint</div><div class="h">#FFE0D1</div></div>
  </div>
</body>
</html>
