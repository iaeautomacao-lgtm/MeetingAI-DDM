<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Semantic Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; height: 180px; }
  .pill { border-radius: 16px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; color: white; font-family: var(--font-display); }
  .pill .name { font-size: 16px; font-weight: 600; }
  .pill .role { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .pill .h { font-family: var(--font-mono); font-size: 12px; opacity: 0.85; font-weight: 400; }
  .succ { background: var(--ddm-success); }
  .warn { background: var(--ddm-warning); }
  .dang { background: var(--ddm-danger); }
  .info { background: var(--ddm-info); }
  .icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="pill succ"><div class="icon">✓</div><div><div class="name">Success</div><div class="role">Pago / confirmado</div></div><div class="h">#2BAE66</div></div>
    <div class="pill warn"><div class="icon">!</div><div><div class="name">Warning</div><div class="role">Vence em breve</div></div><div class="h">#E8A100</div></div>
    <div class="pill dang"><div class="icon">×</div><div><div class="name">Danger</div><div class="role">Em atraso</div></div><div class="h">#D8362F</div></div>
    <div class="pill info"><div class="icon">i</div><div><div class="name">Info</div><div class="role">Em análise</div></div><div class="h">#1F7AE0</div></div>
  </div>
</body>
</html>
