<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 28px; background: var(--bg-1); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .row .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 130px; flex-shrink: 0; }
  .row .meta b { color: var(--fg-2); font-weight: 600; }
  .hero { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1.05; color: var(--fg-1); letter-spacing: -0.02em; }
  .h1   { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.1;  color: var(--fg-1); letter-spacing: -0.015em; }
  .h2   { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.2;  color: var(--fg-1); letter-spacing: -0.01em; }
  .scribble { color: var(--ddm-orange); position: relative; }
  .scribble::after { content:""; position:absolute; left:-2%; right:-2%; bottom:-0.18em; height:0.28em; background: url("../assets/underline-scribble.png") center/100% 100% no-repeat; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row"><div class="meta"><b>Hero</b> · 56 / 700</div><div class="hero">Eficiência na <span class="scribble">Recuperação</span></div></div>
    <div class="row"><div class="meta"><b>H1</b> · 40 / 700</div><div class="h1">Para sua instituição.</div></div>
    <div class="row"><div class="meta"><b>H2</b> · 28 / 600</div><div class="h2">Produtos exclusivos para escolas</div></div>
  </div>
</body>
</html>
