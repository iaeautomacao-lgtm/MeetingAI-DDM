<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Spacing & Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  h3 { margin: 0 0 12px; font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--fg-3); letter-spacing: 0.12em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .row  { display: flex; align-items: flex-end; gap: 14px; }
  .sp   { background: var(--ddm-orange-100); border-radius: 4px; flex-shrink: 0; }
  .sp + .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .sp-block { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sp-block .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .sp-block .meta b { color: var(--fg-2); font-weight: 600; }

  .rgrid { display: flex; align-items: flex-end; gap: 16px; }
  .rad { width: 64px; height: 64px; background: var(--ddm-orange); display: flex; align-items: center; justify-content: center; color: white; font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <h3>Spacing scale · 4-pt</h3>
      <div class="row">
        <div class="sp-block"><div class="sp" style="width:4px;height:32px"></div><div class="meta"><b>1</b> 4</div></div>
        <div class="sp-block"><div class="sp" style="width:8px;height:32px"></div><div class="meta"><b>2</b> 8</div></div>
        <div class="sp-block"><div class="sp" style="width:12px;height:32px"></div><div class="meta"><b>3</b> 12</div></div>
        <div class="sp-block"><div class="sp" style="width:16px;height:32px"></div><div class="meta"><b>4</b> 16</div></div>
        <div class="sp-block"><div class="sp" style="width:24px;height:32px"></div><div class="meta"><b>5</b> 24</div></div>
        <div class="sp-block"><div class="sp" style="width:32px;height:32px"></div><div class="meta"><b>6</b> 32</div></div>
        <div class="sp-block"><div class="sp" style="width:48px;height:32px"></div><div class="meta"><b>7</b> 48</div></div>
        <div class="sp-block"><div class="sp" style="width:64px;height:32px"></div><div class="meta"><b>8</b> 64</div></div>
      </div>
    </div>
    <div>
      <h3>Corner radii</h3>
      <div class="rgrid">
        <div class="rad" style="border-radius: 6px;">6</div>
        <div class="rad" style="border-radius: 12px;">12</div>
        <div class="rad" style="border-radius: 20px;">20</div>
        <div class="rad" style="border-radius: 32px;">32</div>
        <div class="rad" style="border-radius: 48px;">48</div>
        <div class="rad" style="border-radius: 999px;">pill</div>
      </div>
    </div>
  </div>
</body>
</html>
