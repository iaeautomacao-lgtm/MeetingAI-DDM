<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Shadow Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 36px 24px; background: var(--bg-2); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-items: end; }
  .card { background: white; border-radius: 16px; height: 110px; display: flex; align-items: flex-end; padding: 14px; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--fg-2); }
  .card .h { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); font-weight: 400; margin-top: 2px; }
  .e1 { box-shadow: var(--shadow-sm); }
  .e2 { box-shadow: var(--shadow-md); }
  .e3 { box-shadow: var(--shadow-lg); }
  .e4 { box-shadow: var(--shadow-orange); background: var(--ddm-orange); color: white; }
</style>
</head>
<body>
  <div class="row">
    <div class="card e1"><div>shadow-sm<div class="h">subtle separation</div></div></div>
    <div class="card e2"><div>shadow-md<div class="h">card hover</div></div></div>
    <div class="card e3"><div>shadow-lg<div class="h">overlay / modal</div></div></div>
    <div class="card e4"><div>shadow-orange<div class="h" style="color:rgba(255,255,255,0.7)">CTA lift</div></div></div>
  </div>
</body>
</html>
