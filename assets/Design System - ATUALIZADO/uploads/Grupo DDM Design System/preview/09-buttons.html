<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 24px; background: var(--bg-1); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: center; justify-items: start; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: 100%; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .btn-prim, .btn-prim-h, .btn-prim-p, .btn-ghost, .btn-pill-sm, .btn-link, .btn-arrow {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    border: none; cursor: pointer; transition: all 140ms cubic-bezier(0.22,0.61,0.36,1);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 26px; border-radius: 999px;
  }
  .btn-prim   { background: var(--ddm-orange); color: white; box-shadow: var(--shadow-orange); }
  .btn-prim-h { background: var(--ddm-orange-600); color: white; box-shadow: 0 16px 36px rgba(255,87,6,0.32); transform: translateY(-1px); }
  .btn-prim-p { background: var(--ddm-orange-700); color: white; box-shadow: 0 6px 14px rgba(255,87,6,0.18); }
  .btn-ghost  { background: transparent; color: var(--fg-1); border: 1.5px solid var(--border-strong); }
  .btn-pill-sm{ background: var(--ddm-orange); color: white; padding: 9px 18px; font-size: 13px; box-shadow: var(--shadow-orange); }
  .btn-link   { background: transparent; color: var(--ddm-orange); padding: 6px 0; }
  .btn-link::after { content: "→"; transition: transform 140ms; }
  .btn-arrow  { background: var(--ddm-orange); color: white; width: 56px; height: 56px; padding: 0; border-radius: 50%; box-shadow: var(--shadow-orange); font-size: 22px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col"><div class="label">Primary · default</div><button class="btn-prim">Agendar reunião</button></div>
    <div class="col"><div class="label">Primary · hover</div><button class="btn-prim-h">Agendar reunião</button></div>
    <div class="col"><div class="label">Primary · pressed</div><button class="btn-prim-p">Agendar reunião</button></div>
    <div class="col"><div class="label">Ghost</div><button class="btn-ghost">Sou aluno</button></div>
    <div class="col"><div class="label">Small pill</div><button class="btn-pill-sm">Enviar</button></div>
    <div class="col"><div class="label">Link · "Ver mais"</div><button class="btn-link">Ver mais </button></div>
    <div class="col"><div class="label">Arrow circle</div><button class="btn-arrow">→</button></div>
  </div>
</body>
</html>
