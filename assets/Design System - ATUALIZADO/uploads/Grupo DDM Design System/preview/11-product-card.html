<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Product Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); display: flex; gap: 18px; }
  .card { flex: 1; background: white; border-radius: 32px; padding: 28px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 12px; min-height: 260px; transition: box-shadow 240ms, transform 240ms; }
  .card.hov { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .name { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--ddm-orange); letter-spacing: -0.01em; }
  .desc { font-family: var(--font-body); font-size: 15px; color: var(--fg-2); line-height: 1.55; flex: 1; }
  .more { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ddm-orange); }
  .arrow { width: 36px; height: 36px; border-radius: 50%; background: var(--ddm-orange); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .badge { font-family: var(--font-display); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ddm-orange); background: var(--ddm-orange-50); padding: 6px 10px; border-radius: 999px; align-self: flex-start; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Produto</div>
    <div class="name">RecuperEdu</div>
    <div class="desc">Tenha uma cobrança de mensalidades atrasadas com eficiência e altas taxas de recuperação.</div>
    <div class="more">Ver mais <span class="arrow">→</span></div>
  </div>
  <div class="card hov">
    <div class="badge">Hover state</div>
    <div class="name">GesEdu</div>
    <div class="desc">Ferramenta para controlar fluxo de pagamentos de sua instituição.</div>
    <div class="more">Ver mais <span class="arrow">→</span></div>
  </div>
</body>
</html>
