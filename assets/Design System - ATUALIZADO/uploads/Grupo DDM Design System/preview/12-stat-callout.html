<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Stat Callout</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--bg-2); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stat { background: white; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); }
  .stat .num { font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: 1; color: var(--ddm-orange); letter-spacing: -0.02em; }
  .stat .desc { font-family: var(--font-body); font-size: 13px; line-height: 1.45; color: var(--fg-2); }
  .alt { background: var(--ddm-orange); color: white; }
  .alt .num { color: white; }
  .alt .desc { color: rgba(255,255,255,0.92); }
</style>
</head>
<body>
  <div class="row">
    <div class="stat">
      <div class="num">+38%</div>
      <div class="desc">do market share educacional está conosco. Mais de 2.9 milhões de alunos contam com a DDM.</div>
    </div>
    <div class="stat alt">
      <div class="num">897mi</div>
      <div class="desc">já negociado com alunos, ajudando-os a acharem boas condições financeiras.</div>
    </div>
    <div class="stat">
      <div class="num">R$30MM</div>
      <div class="desc">garantidos em receitas antecipadas para nossas faculdades e colégios.</div>
    </div>
  </div>
</body>
</html>
