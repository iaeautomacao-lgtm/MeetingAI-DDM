<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Illustrations</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-1); font-family: var(--font-body); display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: end; }
  .ill { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ill img { width: 100%; height: 140px; object-fit: contain; }
  .ill .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="ill"><img src="../assets/illustration-payment.png"><div class="lbl">payment.png</div></div>
  <div class="ill"><img src="../assets/illustration-recovery.png"><div class="lbl">recovery.png</div></div>
  <div class="ill"><img src="../assets/illustration-people.png"><div class="lbl">people.png</div></div>
  <div class="ill"><img src="../assets/illustration-laptop.png"><div class="lbl">laptop.png</div></div>
</body>
</html>
