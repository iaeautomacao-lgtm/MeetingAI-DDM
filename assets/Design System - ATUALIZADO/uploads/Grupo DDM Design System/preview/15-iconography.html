<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); }
  .row { display: flex; gap: 14px; align-items: center; }
  .ic   { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--ddm-orange-50); color: var(--ddm-orange); }
  .ic.solid { background: var(--ddm-orange); color: white; }
  .ic svg { width: 22px; height: 22px; }
  .note { font-size: 12px; color: var(--fg-3); margin-left: auto; max-width: 360px; line-height: 1.5; }
</style>
</head>
<body>
<div class="stack">
  <div>
    <div class="lbl">Lucide · stroke 1.5 · in <code>currentColor</code> · fallback substitution</div>
    <div class="row" style="margin-top: 8px;">
      <span class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg></span>
      <span class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg></span>
      <span class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <span class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></span>
      <span class="ic solid"><svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
      <span class="ic solid"><svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="note">Site has no in-house icon font. Lucide @ 1.5 stroke is the working substitution — flagged.</span>
    </div>
  </div>

  <div>
    <div class="lbl">Site-native arrow asset (used on "Ver mais" links)</div>
    <div class="row" style="margin-top: 8px;">
      <img src="../assets/right-arrow.png" style="height: 30px;">
      <span class="note">Replace with the SVG version if available; this is a raster export from the marketing site.</span>
    </div>
  </div>
</div>
</body>
</html>
