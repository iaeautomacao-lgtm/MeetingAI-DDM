<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Voice & Copy</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-1); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-3); margin-bottom: 4px; }
  .yes, .no { padding: 12px 16px; border-radius: 14px; font-family: var(--font-display); font-weight: 500; line-height: 1.4; font-size: 15px; }
  .yes { background: rgba(43, 174, 102, 0.10); color: #19663d; border-left: 3px solid var(--ddm-success); }
  .no  { background: rgba(216, 54, 47, 0.08); color: #82221d; border-left: 3px solid var(--ddm-danger); text-decoration: line-through; text-decoration-color: rgba(130,34,29,0.4); }
  .scribble { color: var(--ddm-orange); position: relative; }
  .scribble::after { content:""; position:absolute; left:-2%; right:-2%; bottom:-0.18em; height:0.25em; background: url("../assets/underline-scribble.png") center/100% 100% no-repeat; }
</style>
</head>
<body>
<div class="stack">
  <div>
    <div class="lbl">Voice — pt-BR · school-admin audience</div>
    <div class="yes">Mais Tempo para o que realmente Importa: <span class="scribble">Educar.</span></div>
  </div>
  <div>
    <div class="lbl">DO — concrete promise + bold punchline</div>
    <div class="yes">Nós operacionalizamos, você controla.</div>
  </div>
  <div>
    <div class="lbl">DON'T — hype / slang / emoji</div>
    <div class="no">🚀 Revolucionário! Disrupte sua cobrança HOJE!!</div>
  </div>
</div>
</body>
</html>
