<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DDM — Compliance Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); display: flex; gap: 28px; align-items: center; }
  .group { display: flex; gap: 14px; align-items: center; }
  .group img { height: 90px; }
  .desc { font-family: var(--font-body); font-size: 13px; color: var(--fg-2); line-height: 1.5; max-width: 280px; }
  .desc b { font-family: var(--font-display); font-weight: 600; color: var(--fg-1); display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="group">
    <img src="../assets/badge-lgpd.png" alt="LGPD">
    <img src="../assets/badge-esg.png" alt="ESG">
  </div>
  <div class="desc">
    <b>Compliance seals</b>
    Footer-only. LGPD (privacy) + ESG. Always paired, sized identically. Use `assets/badge-lgpd.png` and `assets/badge-esg.png`.
  </div>
</body>
</html>
