<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Executivo — Meeting DDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ddm-orange:#FF5706; --ink:#1F1F1F; --ink-2:#3D3D3D; --gray:#939598;
  --border:#E8E8EC; --bg-alt:#F4F4F6; --white:#FFF; --danger:#E5484D;
  --r-md:12px; --font-display:'Poppins',sans-serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:#EBE5DB;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--white);border-radius:32px;box-shadow:0 20px 40px rgba(0,0,0,.06);width:100%;max-width:400px;padding:44px 40px;text-align:center;}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:28px;}
.logo img{height:40px;width:auto;}
h1{font-family:var(--font-display);font-size:22px;margin-bottom:6px;}
.sub{font-size:13px;color:var(--gray);margin-bottom:28px;}
label{display:block;text-align:left;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2);}
input,select{width:100%;background:var(--bg-alt);border:1px solid transparent;border-radius:var(--r-md);padding:13px 14px;font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:18px;}
input:focus,select:focus{border-color:var(--ddm-orange);}
.btn{width:100%;background:var(--ink);color:#fff;border:none;padding:14px;border-radius:var(--r-md);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;font-family:var(--font-body);}
.btn:hover{background:var(--ddm-orange);}
.err{background:#FDECEC;color:var(--danger);padding:12px;border-radius:var(--r-md);font-size:13px;margin-bottom:18px;display:none;}
.ok{background:#E7F6EC;color:#1E7B45;padding:12px;border-radius:var(--r-md);font-size:13px;margin-bottom:18px;display:none;text-align:left;line-height:1.5;}
.foot{margin-top:24px;font-size:12px;color:var(--gray);}
.foot a{color:var(--ddm-orange);text-decoration:none;font-weight:600;}
.minor-link{display:inline-block;margin-top:12px;color:var(--ddm-orange);font-size:12px;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/assets/logo-mark.png" alt="DDM" />
    Meeting DDM
  </div>
  <h1 id="titulo">Acesso Executivo</h1>
  <p class="sub" id="subtitulo">Acesse o painel do Meeting DDM</p>

  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <!-- LOGIN -->
  <form id="form-login" onsubmit="entrar(event)">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="voce@ddm.adv.br" autofocus>
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••••" required>
    <button class="btn" type="submit">Entrar</button>
    <a class="minor-link" href="#" onclick="mostrarRecuperacao(event)">Esqueci minha senha</a>
  </form>

  <!-- RECUPERAR SENHA -->
  <form id="form-recuperar" onsubmit="solicitarCodigoSenha(event)" style="display:none">
    <label for="f-email">E-mail cadastrado</label>
    <input type="email" id="f-email" placeholder="voce@ddm.adv.br" required>
    <button class="btn" type="submit">Enviar código</button>
  </form>

  <form id="form-redefinir" onsubmit="redefinirSenha(event)" style="display:none">
    <label for="f-codigo">Código recebido por e-mail</label>
    <input type="text" id="f-codigo" placeholder="000000" inputmode="numeric" maxlength="6" required>
    <label for="f-senha">Nova senha</label>
    <input type="password" id="f-senha" placeholder="mín. 6 caracteres" minlength="6" required>
    <label for="f-senha2">Confirme a nova senha</label>
    <input type="password" id="f-senha2" placeholder="repita a senha" minlength="6" required>
    <button class="btn" type="submit">Redefinir senha</button>
  </form>

  <!-- SOLICITAR ACESSO (auto-cadastro, requer aprovação) -->
  <form id="form-registro" onsubmit="registrar(event)" style="display:none">
    <label for="r-nome">Nome</label>
    <input type="text" id="r-nome" placeholder="Seu nome">
    <label for="r-email">E-mail da empresa</label>
    <input type="email" id="r-email" placeholder="voce@ddm.adv.br" required>
    <label for="r-setor">Seu setor</label>
    <select id="r-setor" required>
      <option value="">Selecione o setor…</option>
    </select>
    <label for="r-perfil">Tipo de acesso solicitado</label>
    <select id="r-perfil" required>
      <option value="usuario">Usuário normal</option>
      <option value="gestor">Gestor do setor</option>
      <option value="diretor">Diretor</option>
    </select>
    <label for="r-senha">Crie uma senha</label>
    <input type="password" id="r-senha" placeholder="mín. 6 caracteres" minlength="6" required>
    <label for="r-senha2">Confirme a senha</label>
    <input type="password" id="r-senha2" placeholder="repita a senha" minlength="6" required>
    <button class="btn" type="submit">Solicitar acesso</button>
  </form>

  <div class="foot">
    <a href="#" id="link-toggle" onclick="toggle(event)">Ainda não tem acesso? Solicitar</a>
    <br><br>
    <a href="#" id="link-login" onclick="mostrarLogin(event)" style="display:none">← Voltar ao login</a>
    <br><br>
    <a href="/">← Registrar uma reunião</a>
  </div>
</div>

<script>
const err=document.getElementById('err'), ok=document.getElementById('ok');
function showErr(m){ ok.style.display='none'; err.textContent=m; err.style.display='block'; }
function showOk(m){ err.style.display='none'; ok.textContent=m; ok.style.display='block'; }
function clearMsg(){ err.style.display='none'; ok.style.display='none'; }

function toggle(ev){
  ev.preventDefault();
  const login=document.getElementById('form-login');
  const reg=document.getElementById('form-registro');
  const rec=document.getElementById('form-recuperar');
  const redef=document.getElementById('form-redefinir');
  const link=document.getElementById('link-toggle');
  const linkLogin=document.getElementById('link-login');
  const tit=document.getElementById('titulo');
  const sub=document.getElementById('subtitulo');
  const modoLogin = login.style.display!=='none';
  clearMsg();
  if(modoLogin){
    login.style.display='none'; reg.style.display='block'; rec.style.display='none'; redef.style.display='none';
    link.textContent='← Voltar ao login';
    linkLogin.style.display='none';
    tit.textContent='Solicitar acesso'; sub.textContent='Cadastro precisa ser aprovado pelo administrador';
    document.getElementById('r-email').value=document.getElementById('email').value;
    carregarSetores();
  }else{
    login.style.display='block'; reg.style.display='none'; rec.style.display='none'; redef.style.display='none';
    link.textContent='Ainda não tem acesso? Solicitar';
    linkLogin.style.display='none';
    tit.textContent='Acesso Executivo'; sub.textContent='Acesse o painel do Meeting DDM';
  }
}

function mostrarLogin(ev){
  if(ev) ev.preventDefault();
  clearMsg();
  document.getElementById('form-login').style.display='block';
  document.getElementById('form-registro').style.display='none';
  document.getElementById('form-recuperar').style.display='none';
  document.getElementById('form-redefinir').style.display='none';
  document.getElementById('link-toggle').style.display='inline';
  document.getElementById('link-toggle').textContent='Ainda não tem acesso? Solicitar';
  document.getElementById('link-login').style.display='none';
  document.getElementById('titulo').textContent='Acesso Executivo';
  document.getElementById('subtitulo').textContent='Acesse o painel do Meeting DDM';
}

function mostrarRecuperacao(ev){
  ev.preventDefault();
  clearMsg();
  document.getElementById('form-login').style.display='none';
  document.getElementById('form-registro').style.display='none';
  document.getElementById('form-recuperar').style.display='block';
  document.getElementById('form-redefinir').style.display='none';
  document.getElementById('link-toggle').style.display='none';
  document.getElementById('link-login').style.display='inline';
  document.getElementById('titulo').textContent='Recuperar senha';
  document.getElementById('subtitulo').textContent='Receba um código no seu e-mail cadastrado';
  document.getElementById('f-email').value=document.getElementById('email').value.trim();
}

async function entrar(ev){
  ev.preventDefault(); clearMsg();
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
    if(r.ok){ window.location='/painel'; return; }
    const d=await r.json().catch(()=>({}));
    if(d.pendente){ showErr('Seu cadastro ainda está aguardando aprovação do administrador.'); return; }
    showErr('Credenciais inválidas.');
  }catch(e){ showErr('Erro de conexão.'); }
}

async function solicitarCodigoSenha(ev){
  ev.preventDefault(); clearMsg();
  const email=document.getElementById('f-email').value.trim();
  try{
    const r=await fetch('/api/auth/esqueci-senha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ showErr(d.msg || d.erro || 'Não foi possível enviar o código.'); return; }
    showOk(d.msg || 'Código enviado. Verifique seu e-mail.');
    document.getElementById('form-recuperar').style.display='none';
    document.getElementById('form-redefinir').style.display='block';
    document.getElementById('subtitulo').textContent='Informe o código recebido e crie uma nova senha';
    document.getElementById('f-codigo').focus();
  }catch(e){ showErr('Erro de conexão.'); }
}

async function redefinirSenha(ev){
  ev.preventDefault(); clearMsg();
  const email=document.getElementById('f-email').value.trim();
  const codigo=document.getElementById('f-codigo').value.trim();
  const senha=document.getElementById('f-senha').value;
  const senha2=document.getElementById('f-senha2').value;
  if(senha!==senha2){ showErr('As senhas não conferem.'); return; }
  try{
    const r=await fetch('/api/auth/redefinir-senha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,codigo,senha})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ showErr(d.msg || d.erro || 'Não foi possível redefinir a senha.'); return; }
    showOk('Senha redefinida. Você já pode entrar com a nova senha.');
    document.getElementById('senha').value='';
    document.getElementById('email').value=email;
    document.getElementById('form-redefinir').reset();
    setTimeout(()=>mostrarLogin(),900);
  }catch(e){ showErr('Erro de conexão.'); }
}

let _setoresCarregados=false;
async function carregarSetores(){
  if(_setoresCarregados) return;
  try{
    const r=await fetch('/api/setores'); const setores=await r.json();
    const sel=document.getElementById('r-setor');
    (setores||[]).forEach(s=>{const o=document.createElement('option');o.value=s.nome;o.textContent=s.nome;sel.appendChild(o);});
    _setoresCarregados=true;
  }catch(e){}
}

async function registrar(ev){
  ev.preventDefault(); clearMsg();
  const nome=document.getElementById('r-nome').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const setor=document.getElementById('r-setor').value;
  const perfil_solicitado=document.getElementById('r-perfil').value;
  const senha=document.getElementById('r-senha').value;
  const senha2=document.getElementById('r-senha2').value;
  if(!setor){ showErr('Escolha o seu setor.'); return; }
  if(senha!==senha2){ showErr('As senhas não conferem.'); return; }
  try{
    const r=await fetch('/api/auth/registrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,senha,setor,perfil_solicitado})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      showOk('Cadastro enviado! Aguarde a aprovação do administrador — você poderá entrar assim que for liberado.');
      document.getElementById('form-registro').reset();
      return;
    }
    showErr(d.msg || d.erro || 'Não foi possível concluir o cadastro.');
  }catch(e){ showErr('Erro de conexão.'); }
}
</script>
</body>
</html>
