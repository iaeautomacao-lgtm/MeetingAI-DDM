<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meeting DDM</title>
  <style>
    html,body{margin:0;height:100%;background:#0f1115;color:#e8e8ea;
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .box{padding:24px}
    h1{font-size:20px;margin:16px 0 4px}
    p{opacity:.6;font-size:14px}
    .dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;
      display:inline-block;animation:p 1s infinite alternate}
    @keyframes p{to{opacity:.2}}
  </style>
</head>
<body>
  <div class="box">
    <h1>Meeting DDM</h1>
    <p>Conectando ao painel <span class="dot"></span></p>
    <p style="margin-top:12px">Sem conexão? Verifique a internet.</p>
  </div>
</body>
</html>
